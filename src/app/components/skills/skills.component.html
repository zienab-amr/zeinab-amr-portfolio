<section class="section container skills-section fade-in is-visible" id="skills">
  
  <div class="section-header">
    <span class="section-eyebrow">TECHNICAL EXPERTISE</span>
    <h2 class="section-title">Skills & Stack</h2>
  </div>

  <div class="skills-tabs">
    <button 
      *ngFor="let cat of categories"
      class="btn btn--sm"
      [class.btn--primary]="cat === activeCategory"
      [class.btn--ghost]="cat !== activeCategory"
      (click)="activeCategory = cat">
      {{ cat }}
    </button>
  </div>

  <div class="skills-grid">
    
    <div class="glass-card skill-card" *ngFor="let tech of filteredSkills">
      
      <div class="skill-icon-wrapper">
        <i class="fas fa-code"></i>
      </div>
      
      <span class="skill-name">{{ tech.name }}</span>
      
    </div>

  </div>

</section>
